<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>البطة الصفرا - جاري تجهيز المنصة</title>
  <style>
    :root{--duck:#f6c90e;--ink:#15171a;--muted:#6b7280;--bg:#fffaf0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fffdf6 0%,#fff7d6 52%,#fffaf0 100%);font-family:Tahoma,Arial,sans-serif;color:var(--ink);padding:24px}.card{width:min(680px,100%);background:rgba(255,255,255,.95);border:1px solid rgba(21,23,26,.08);border-radius:28px;padding:38px;box-shadow:0 22px 70px rgba(30,30,20,.1);text-align:center}.duck{width:92px;height:92px;margin:0 auto 18px;border-radius:28px;background:var(--duck);display:grid;place-items:center;font-size:52px;box-shadow:0 14px 28px rgba(246,201,14,.3)}h1{margin:0;font-size:clamp(28px,5vw,44px);line-height:1.2}h1 span{display:block;font-size:.48em;font-weight:600;color:#4b5563;margin-top:8px}p{font-size:17px;line-height:1.9;color:var(--muted);margin:22px auto 0;max-width:560px}.status{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:12px 18px;border-radius:999px;background:#fff8d7;font-weight:700;color:#665000}.dot{width:10px;height:10px;border-radius:50%;background:#f4b400;box-shadow:0 0 0 6px rgba(244,180,0,.12)}.detail{margin:14px auto 0;font-size:13px;color:#8a8f98}.note{margin-top:24px;padding-top:22px;border-top:1px solid #ececec;font-size:14px;color:#8a8f98}
  </style>
</head>
<body>
  <main class="card">
    <div class="duck" aria-hidden="true">🐥</div>
    <h1>البطة الصفرا<span>لخدمات السوشيال ميديا</span></h1>
    <p id="message">الخدمة شغالة، وجاري إكمال تهيئة قاعدة البيانات. بمجرد اكتمالها هتنتقل للمنصة تلقائيًا.</p>
    <div class="status"><span class="dot"></span><span id="statusText"> جاري تجهيز قاعدة البيانات</span></div>
    <div class="detail" id="detail">جاري قراءة حالة التهيئة…</div>
    <div class="note">Yellow Duck SMM Platform</div>
  </main>
<script>
(() => {
  const labels = {
    not_configured: 'متغيرات قاعدة البيانات غير مرتبطة بالخدمة',
    unreachable: 'تعذر الاتصال بقاعدة البيانات',
    connected: 'تم الاتصال بقاعدة البيانات',
    checking: 'جاري فحص الاتصال',
    seeding: 'جاري إضافة بيانات المنصة الأساسية',
    migration_failed: 'توقفت عملية إنشاء جداول قاعدة البيانات',
    seed_failed: 'توقفت عملية إضافة البيانات الأساسية',
    ready: 'المنصة جاهزة'
  };

  async function check() {
    try {
      const res = await fetch('/boot-health.json?ts=' + Date.now(), {cache:'no-store'});
      if (!res.ok) return;
      const data = await res.json();
      const state = data.connection || 'checking';
      document.getElementById('detail').textContent = labels[state] || ('حالة التهيئة: ' + state);
      if (state === 'ready') {
        document.getElementById('statusText').textContent = ' جاهزة — جاري فتح المنصة';
        setTimeout(() => location.replace('/'), 600);
      }
    } catch (_) {}
  }

  check();
  setInterval(check, 4000);
})();
</script>
</body>
</html>
