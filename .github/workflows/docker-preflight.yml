name: Docker Preflight

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - overrides/**
      - .github/workflows/docker-preflight.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - overrides/**
      - .github/workflows/docker-preflight.yml
  workflow_dispatch:

jobs:
  docker-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --progress=plain -t smm-preflight .

      - name: Verify Composer autoload
        run: docker run --rm --entrypoint php smm-preflight -r 'require "vendor/autoload.php"; if (!class_exists("Illuminate\\Support\\Collection")) { exit(1); } echo "autoload OK\n";'

      - name: Lint application PHP
        run: |
          docker run --rm --entrypoint sh smm-preflight -c '
            set -eu
            find app routes scripts -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          '

      - name: Verify Laravel CLI bootstrap
        run: docker run --rm --entrypoint php smm-preflight artisan --version

      - name: Verify route registration
        run: docker run --rm --entrypoint php smm-preflight artisan route:list
